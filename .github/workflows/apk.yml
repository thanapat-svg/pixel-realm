name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release APK
        run: docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk cargo quad-apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pixel_realm-apk
          path: target/android-artifacts/release/apk/pixel_realm.apk
