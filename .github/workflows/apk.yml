name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare assets (BGM/SFX + sprites)
        run: bash tools/prepare_assets.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-preview
          path: build/sprite_preview
          if-no-files-found: ignore
      - name: Build release APK
        run: |
          set +e
          sed -i "s/^version_name = .*/&\nversion_code = $((1000 + ${{ github.run_number }}))/" Cargo.toml && grep -n "version_" Cargo.toml
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c "rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-linux-android && rustc --version && cargo quad-apk build --release" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$(grep -v '^\s*\(Compiling\|Downloaded\|Downloading\)' build.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-log::$msg"
          fi
          exit $rc
      - name: Re-sign APK with fixed key (so updates install over the old app)
        run: |
          set -e
          A=target/android-artifacts/release/apk/pixel_realm.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # ไฟล์จาก docker เป็นของ root → ทำงานใน /tmp แล้วค่อยคัดลอกกลับ
          cp "$A" /tmp/unsigned.apk
          zip -q -d /tmp/unsigned.apk 'META-INF/*'
          "$BT/zipalign" -f -p 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks ci/pixel_realm.keystore --ks-pass pass:pixelrealm --key-pass pass:pixelrealm --ks-key-alias pixelrealm --out /tmp/signed.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs /tmp/signed.apk | head -3
          sudo cp /tmp/signed.apk "$A"
      - name: APK size
        run: ls -l target/android-artifacts/release/apk/pixel_realm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pixel_realm-apk
          path: target/android-artifacts/release/apk/pixel_realm.apk
      - name: Publish APK (release + apk branch)
        run: |
          cp target/android-artifacts/release/apk/pixel_realm.apk /tmp/pixel_realm.apk
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk /tmp/pixel_realm.apk --title "Pixel Realm APK" --notes "Auto-built from ${GITHUB_SHA}"
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan apk; git rm -rfq . ; cp /tmp/pixel_realm.apk .
          git add pixel_realm.apk; git commit -qm "APK ${GITHUB_SHA}"; git push -f origin apk
        env:
          GH_TOKEN: ${{ github.token }}
