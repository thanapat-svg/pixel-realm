[package]
name = "pixel_realm"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true

[package.metadata.android]
label = "Pixel Realm"
# CI ใส่ version_code เพิ่มขึ้นทุก build (ให้ Android อัปเดตทับได้ครบ)
version_name = "v38"
fullscreen = true
icon = "@mipmap/ic_launcher"
res = "android_res"
assets = "assets"
min_sdk_version = 24
target_sdk_version = 34
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
"android:exported" = "true"

# miniquad 0.4.11 + แก้ Java ให้ซ่อนแถบนำทางบน Android 11+ (เต็มจอจริง)
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
quad-snd = { path = "vendor/quad-snd" }
