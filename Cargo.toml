[package]
name = "pixel_realm"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true

[package.metadata.android]
label = "Pixel Realm"
fullscreen = true
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "userLandscape"
